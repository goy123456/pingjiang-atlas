name: Verify live map gestures
on:
  push:
    branches: [qa/live-map-gestures-20261124]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa
          persist-credentials: false
      - name: Install browser test client
        run: npm install --prefix "$RUNNER_TEMP/map-qa" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
      - name: Test the public site in real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/map-qa/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          node qa/check-public-map.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-map-evidence
          path: map-evidence/
          retention-days: 7
