<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平江图 · 地图展示版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#304d48;font-family:system-ui}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 4vw;border-bottom:1px solid #ddd}
h1{font:26px serif;margin:0 auto 0 0}a{color:inherit;text-decoration:none;padding:9px 14px;border-radius:24px}
a[aria-current=true]{background:#304d48;color:white}iframe{border:0;width:100%;height:calc(100dvh - 96px);display:block}
small{display:block;text-align:center;font-size:12px;padding:6px;color:#687b72}</style>
<header><h1>平江图</h1><a href="#map">探索地图</a><a href="#compare">古今对照</a></header>
<iframe id="map" title="平江交互地图"></iframe>
<small>地图展示版 · 不提供在线 AI 问答 · 底图 © OpenStreetMap contributors</small>
<script>function show(){const compare=location.hash==='#compare';
document.getElementById('map').src='static/'+(compare?'visitor-compare.html':'modern-map-visitor.html');
document.querySelectorAll('header a').forEach(a=>a.setAttribute('aria-current',a.hash===(compare?'#compare':'#map')));}
addEventListener('hashchange',show);show();</script></html>
